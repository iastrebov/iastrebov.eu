---
layout: default
---
{% assign post_image = page.image.url | default: site.social_image %}

<div class="pb-0 pb-sm-2">
    <h2 class="title title--h1 title__separate">Blog</h2>
</div>

<!-- Post -->
<div class="pb-3">
    <header class="header-post">
        <h1 class="title title--h1">{{ page.title }}</h1>
        <div class="caption-post">
            {{ page.greeting}}
        </div>
        <div class="header-post__image-wrap">
            <img class="cover lazyload" src="{{ post_image | relative_url }}" alt="{{ page.image.alt | default: page.title }}"/>
        </div>
    </header>
    {{ content }}
</div>

{% include comments.html %}
